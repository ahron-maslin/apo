<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>apo social card</title>
<!--
  Source for ../img/og.png, the 1200x630 image link previews show (og:image, twitter:image).
  To re-render, from the repo root, with any Chrome or Chromium:
    chrome --headless --hide-scrollbars --window-size=1200,630 \
      --screenshot=site/img/og.png "file://$PWD/site/_og/og.html"
  Keep the PNG under about 300 KB. Text is set in Inter when it's installed, else the
  system sans. Colours are the page's light tokens.
-->
<style>
:root {
  --bg: #f7f7f6;
  --surface: #ffffff;
  --border: #e5e5e2;
  --border-strong: #d3d3cf;
  --text: #17171a;
  --text-2: #4a4a52;
  --text-3: #6c6c75;
  --accent: #4352e0;
  --accent-fg: #ffffff;
  --accent-text: #3a47cc;
  --accent-soft: #eef0fd;
  --accent-border: #cdd2fa;
  --font-sans: "Inter var", "InterVariable", "Inter", ui-sans-serif, system-ui, -apple-system,
               "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
html, body { margin: 0; }
body {
  position: relative; width: 1200px; height: 630px; overflow: hidden;
  background: var(--bg); color: var(--text); font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
.glow {
  position: absolute; right: -240px; bottom: -320px; width: 1000px; height: 820px;
  background: radial-gradient(closest-side, var(--accent-soft), rgb(238 240 253 / 0));
}
.copy {
  position: absolute; left: 72px; top: 0; bottom: 0; width: 540px;
  display: flex; flex-direction: column; justify-content: center;
}
.brand { display: flex; align-items: center; gap: 18px; }
.brand svg { width: 72px; height: 72px; flex: none; }
.brand-name { font-size: 60px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.brand-sub { margin-top: 14px; font-size: 22px; font-weight: 500; color: var(--text-3); }
h1 {
  margin: 44px 0 0; font-size: 56px; font-weight: 700; line-height: 1.07; letter-spacing: -.03em;
}
p { margin: 26px 0 0; font-size: 24px; line-height: 1.45; color: var(--text-2); }
.shot {
  position: absolute; left: 664px; top: 76px; width: 640px; height: 640px;
  border: 1px solid var(--border-strong); border-radius: 16px; overflow: hidden;
  background: var(--surface) url("../img/now-light.webp") no-repeat;
  background-size: 1060px auto; background-position: -150px -58px;
  box-shadow: 0 30px 60px -20px rgb(16 18 27 / .28), 0 8px 20px -8px rgb(16 18 27 / .12);
}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="shot" role="img" aria-label="The apo dashboard's Now page"></div>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#4352e0"/>
        <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.57 18.85A6.5 6.5 0 1 1 12.95 21.23L9.4 23Z"/><path d="M22.7 9.1v13"/>
        </g>
      </svg>
      <div class="brand-name">apo</div>
    </div>
    <div class="brand-sub">AI Project Orchestration</div>
    <h1>Your Claude Code agents ask instead of stopping.</h1>
    <p>Answer every project's questions in one dashboard. The repo keeps the answer.</p>
  </div>
</body>
</html>
