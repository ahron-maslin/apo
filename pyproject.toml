[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getapo"
dynamic = ["version"]
description = "apo (AI Project Orchestration): a local dashboard and MCP server for Claude Code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "mcp",
    "cryptography",
    "markdown",
    "platformdirs",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.urls]
Homepage = "https://getapo.pages.dev/"

[project.scripts]
apo = "apo.cli:main"
ado = "apo.cli:legacy_main"

[tool.setuptools.dynamic]
version = { attr = "apo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
